<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Alper Yavuz — Video Editor Portfolio">
  <title>Alper Yavuz — Video Editor</title>

  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>
  <div class="loader" aria-hidden="true">
    <div class="loader__bar"><span></span></div>
    <span class="loader__count">00</span>
  </div>

  <div class="cursor" aria-hidden="true">
    <span data-tr="GÖR" data-en="VIEW">GÖR</span>
  </div>

  <header class="header">
    <a class="brand" href="#top" aria-label="Alper Yavuz">
      <span class="brand__thin">Alper</span>
      <span class="brand__bold">Yavuz</span>
    </a>

    <div class="header__actions">
      <div class="language" data-active="tr" role="group" aria-label="Dil seçimi">
        <span class="language__indicator" aria-hidden="true"></span>
        <button class="language__button is-active" type="button" data-language="tr">TR</button>
        <button class="language__button" type="button" data-language="en">EN</button>
      </div>

      <button class="menu-button" type="button" aria-expanded="false" aria-controls="menu">
        <span data-tr="MENÜ" data-en="MENU">MENÜ</span>
        <span class="menu-button__icon" aria-hidden="true"><i></i><i></i></span>
      </button>
    </div>
  </header>

  <nav class="menu" id="menu" aria-hidden="true">
    <div class="menu__inner">
      <a href="#work" data-menu-close><small>01</small><strong data-tr="İŞLER" data-en="WORK">İŞLER</strong></a>
      <a href="#info" data-menu-close><small>02</small><strong data-tr="BİLGİ" data-en="INFO">BİLGİ</strong></a>
      <a href="#contact" data-menu-close><small>03</small><strong data-tr="İLETİŞİM" data-en="CONTACT">İLETİŞİM</strong></a>
    </div>
  </nav>

  <aside class="progress" aria-hidden="true">
    <span class="progress__label" data-tr="KAYDIR" data-en="SCROLL">KAYDIR</span>
    <span class="progress__track"><i></i></span>
    <span class="progress__number">01</span>
  </aside>

  <main id="top">
    <section class="hero">
      <div class="hero__role"><span id="hero-role" data-tr="VİDEO EDİTÖRÜ" data-en="VIDEO EDITOR">VİDEO EDİTÖRÜ</span><i aria-hidden="true"></i></div>
      <div class="hero__bottom">
        <p id="hero-copy" data-tr="Görüntü, ritim ve hikâye." data-en="Image, rhythm and story.">Görüntü, ritim ve hikâye.</p>
        <span id="project-range">01 — 05</span>
      </div>
    </section>

    <section class="work" id="work" aria-label="Portfolio"></section>

    <section class="reserved" id="info">
      <span id="info-label" data-tr="BİLGİ +" data-en="INFO +">BİLGİ +</span>
      <div class="reserved__line"></div>
      <span id="info-text" data-tr="SONRA EKLENECEK" data-en="COMING LATER">SONRA EKLENECEK</span>
    </section>

    <section class="reserved" id="contact">
      <span id="contact-label" data-tr="İLETİŞİM +" data-en="CONTACT +">İLETİŞİM +</span>
      <div class="reserved__line"></div>
      <span id="contact-text" data-tr="SONRA EKLENECEK" data-en="COMING LATER">SONRA EKLENECEK</span>
    </section>
  </main>

  <div class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Project preview">
    <button class="modal__close" type="button" aria-label="Kapat">×</button>
    <div class="modal__content">
      <span class="modal__number">01</span>
      <h2>Project 01</h2>
      <div class="modal__media"><span data-tr="VİDEO BURAYA GELECEK" data-en="VIDEO WILL GO HERE">VİDEO BURAYA GELECEK</span></div>
    </div>
  </div>

  <footer class="footer">
    <span>© 2026 Alper Yavuz</span>
    <a href="#top" data-tr="YUKARI" data-en="BACK TO TOP">YUKARI</a>
  </footer>
</body>
</html>
